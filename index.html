<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Timesheet Tracker</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<script>
  function checkPassword() {
  const password = document.getElementById('passwordInput').value;
  if (password === 'tereo') {
    localStorage.setItem('timesheetAuth', 'true');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (window.initApp) window.initApp();
  } else {
    document.getElementById('errorMessage').style.display = 'block';
  }
}

// Check if already authenticated on page load
window.addEventListener('DOMContentLoaded', function() {
  if (localStorage.getItem('timesheetAuth') === 'true') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    if (window.initApp) window.initApp();
  }
});
</script>

<script type="module">
  async function initApp() {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
    const { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc, onSnapshot, query, orderBy } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');

    const firebaseConfig = {
      apiKey: "AIzaSyC6FbeLdjgFf0YMRPpuqfrBr_ZkDQ0jtYk",
      authDomain: "timesheet-tracker-40ffb.firebaseapp.com",
      projectId: "timesheet-tracker-40ffb",
      storageBucket: "timesheet-tracker-40ffb.firebasestorage.app",
      messagingSenderId: "90174310089",
      appId: "1:90174310089:web:6b73b4fda255f24bdb6f18"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // These are the defaults used only until Firestore's 'settings/people' doc loads (or for a
    // brand-new database, which gets seeded with these on first run) - after that, edits made
    // in the People & Rates tab are the source of truth and sync live via onSnapshot below.
    let people = ['Kelly', 'Mum', 'Nicki', 'ATS', 'Estate', 'Paul', 'Shanti'];
    let rates = {
      'Kelly': 50,
      'Mum': 50,
      'Nicki': 60,
      'ATS': 40,
      'Estate': 50,
      'Paul': 60,
      'Shanti': 60
    };

    let entries = [];
    let materials = [];
    let activeTab = 'time';
    let expandedMonths = {};
    let openDatePicker = null; // { id, year, month, top, left } - custom calendar never auto-selects a day

    // Firestore's onSnapshot fires twice per write (once optimistic, once server-confirmed).
    // Rows can also move section (e.g. ticking "paid" moves a row out of the unpaid list),
    // which shrinks the page and makes the browser clamp scroll back up on its own.
    // Locking to the scroll position from BEFORE the click - and holding it through both
    // snapshot firings - stops that jump, even when ticking several rows in a row.
    let pendingScrollLock = null;
    let scrollLockTimer = null;
    function lockScroll() {
      if (pendingScrollLock === null) pendingScrollLock = window.scrollY;
      clearTimeout(scrollLockTimer);
      scrollLockTimer = setTimeout(() => { pendingScrollLock = null; }, 2000);
    }

    // Load entries from Firebase
    const entriesQuery = query(collection(db, 'entries'), orderBy('date', 'desc'));
    onSnapshot(entriesQuery, (snapshot) => {
      entries = [];
      snapshot.forEach((doc) => {
        entries.push({ id: doc.id, ...doc.data() });
      });
      render();
    });

    // Load materials from Firebase
    const materialsQuery = query(collection(db, 'materials'));
    onSnapshot(materialsQuery, (snapshot) => {
      materials = [];
      snapshot.forEach((doc) => {
        materials.push({ id: doc.id, ...doc.data() });
      });
      render();
    });

    // Load people & rates from Firebase - lets rates be changed and new customers added
    // from the People & Rates tab instead of being hardcoded.
    const settingsRef = doc(db, 'settings', 'people');
    onSnapshot(settingsRef, (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.data();
        if (Array.isArray(data.names)) people = data.names;
        if (data.rates && typeof data.rates === 'object') rates = data.rates;
      } else {
        // First run against a fresh database - seed it with the defaults above so
        // there's one shared source of truth going forward.
        setDoc(settingsRef, { names: people, rates: rates }).catch((error) => {
          console.error('Error seeding people/rates:', error);
        });
      }
      render();
    });

    window.addEntry = async () => {
      const newEntry = {
        date: '',
        person: '',
        startTime: '',
        endTime: '',
        hours: 0,
        notes: '',
        paid: false,
        createdAt: new Date().toISOString()
      };
      
      try {
        await addDoc(collection(db, 'entries'), newEntry);
      } catch (error) {
        console.error('Error adding entry:', error);
      }
    };

    window.addMaterial = async () => {
      const newMaterial = {
        person: '',
        description: '',
        amount: 0,
        paid: false,
        createdAt: new Date().toISOString()
      };
      
      try {
        await addDoc(collection(db, 'materials'), newMaterial);
      } catch (error) {
        console.error('Error adding material:', error);
      }
    };

    window.updateEntry = async (id, field, value) => {
      lockScroll();
      const entry = entries.find(e => e.id === id);
      const updated = { ...entry, [field]: value };
      
      if (field === 'startTime' || field === 'endTime') {
        if (updated.startTime && updated.endTime) {
          const start = parseTime(updated.startTime);
          const end = parseTime(updated.endTime);
          updated.hours = Math.round((end - start) * 10) / 10;
        }
      }
      
      try {
        const entryRef = doc(db, 'entries', id);
        await updateDoc(entryRef, updated);
      } catch (error) {
        console.error('Error updating entry:', error);
      }
    };

    window.updateMaterial = async (id, field, value) => {
      lockScroll();
      const material = materials.find(m => m.id === id);
      const updated = { ...material, [field]: value };
      
      try {
        const materialRef = doc(db, 'materials', id);
        await updateDoc(materialRef, updated);
      } catch (error) {
        console.error('Error updating material:', error);
      }
    };

    window.deleteEntry = async (id) => {
      lockScroll();
      try {
        await deleteDoc(doc(db, 'entries', id));
      } catch (error) {
        console.error('Error deleting entry:', error);
      }
    };

    window.deleteMaterial = async (id) => {
      lockScroll();
      try {
        await deleteDoc(doc(db, 'materials', id));
      } catch (error) {
        console.error('Error deleting material:', error);
      }
    };

    window.setActiveTab = (tab) => {
      activeTab = tab;
      render();
    };

    window.updatePersonRate = async (person, newRate) => {
      const rate = parseFloat(newRate);
      if (isNaN(rate) || rate < 0) {
        render(); // snap the input back to the last saved rate
        return;
      }
      const updatedRates = { ...rates, [person]: rate };
      rates = updatedRates; // update locally straight away so the UI feels instant
      try {
        await updateDoc(doc(db, 'settings', 'people'), { rates: updatedRates });
      } catch (error) {
        console.error('Error updating rate:', error);
      }
    };

    window.addPerson = async () => {
      const name = window.prompt('New person/customer name:');
      if (!name || !name.trim()) return;
      const trimmed = name.trim();
      if (people.some(p => p.toLowerCase() === trimmed.toLowerCase())) {
        alert(`${trimmed} is already in the list.`);
        return;
      }
      const rateInput = window.prompt(`Hourly rate for ${trimmed} ($):`, '60');
      if (rateInput === null) return;
      const rate = parseFloat(rateInput);
      if (isNaN(rate) || rate < 0) {
        alert('Invalid rate - person not added.');
        return;
      }
      const updatedPeople = [...people, trimmed];
      const updatedRates = { ...rates, [trimmed]: rate };
      people = updatedPeople;
      rates = updatedRates;
      render();
      try {
        await updateDoc(doc(db, 'settings', 'people'), { names: updatedPeople, rates: updatedRates });
      } catch (error) {
        console.error('Error adding person:', error);
      }
    };

    window.toggleMonth = (monthKey) => {
      expandedMonths[monthKey] = !expandedMonths[monthKey];
      render();
    };

    function parseTime(timeStr) {
      const cleaned = timeStr.replace(/\s/g, '');
      let hours = 0;
      let minutes = 0;

      if (cleaned.includes(':')) {
        const parts = cleaned.split(':');
        hours = parseInt(parts[0]) || 0;
        minutes = parseInt(parts[1]) || 0;
      } else if (cleaned.includes('.')) {
        const parts = cleaned.split('.');
        hours = parseInt(parts[0]) || 0;
        minutes = parseInt(parts[1]) || 0;
      } else {
        hours = parseInt(cleaned) || 0;
      }

      if (hours >= 24) hours = 0;

      return hours + (minutes / 60);
    }

    function formatDateDisplay(dateStr) {
      if (!dateStr) return 'Select date';
      const [y, m, d] = dateStr.split('-').map(Number);
      if (!y || !m || !d) return 'Select date';
      return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${y}`;
    }

    function formatTime12(timeStr) {
      if (!timeStr) return '';
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10) || 0;
      if (isNaN(h)) return '';
      const suffix = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      return `${h}:${String(m).padStart(2, '0')} ${suffix}`;
    }

    // Start defaults to AM, End defaults to PM, until the user says otherwise
    function defaultAmPm(field) {
      return field === 'endTime' ? 'PM' : 'AM';
    }

    // Manual AM/PM overrides for rows where no time has been typed yet
    // (nothing to derive AM/PM from, so we hold the user's toggle here until they type a number)
    let pendingAmPm = {};

    // Split a stored 24hr "HH:MM" into a 12hr number + AM/PM, for display
    function to12HourParts(time24, field, id) {
      if (!time24) return { display: '', ampm: pendingAmPm[`${id}_${field}`] || defaultAmPm(field) };
      const [hStr, mStr] = time24.split(':');
      let h = parseInt(hStr, 10);
      const m = parseInt(mStr, 10) || 0;
      if (isNaN(h)) return { display: '', ampm: pendingAmPm[`${id}_${field}`] || defaultAmPm(field) };
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      return { display: m ? `${h}:${String(m).padStart(2, '0')}` : `${h}`, ampm };
    }

    // Accepts "8", "8.30", "8:30", "830" as a 12hr number (1-12) + minutes
    function parse12HourNumber(str) {
      const cleaned = (str || '').replace(/\s/g, '');
      let hours = 0;
      let minutes = 0;
      if (cleaned.includes(':')) {
        const parts = cleaned.split(':');
        hours = parseInt(parts[0], 10) || 0;
        minutes = parseInt(parts[1], 10) || 0;
      } else if (cleaned.includes('.')) {
        const parts = cleaned.split('.');
        hours = parseInt(parts[0], 10) || 0;
        minutes = parseInt(parts[1], 10) || 0;
      } else {
        hours = parseInt(cleaned, 10) || 0;
      }
      hours = hours % 12;
      return { hours, minutes };
    }

    function to24Hour(hours12, minutes, ampm) {
      let h = hours12 % 12;
      if (ampm === 'PM') h += 12;
      return `${String(h).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    window.updateTimeNumber = (id, field, rawValue) => {
      if (!rawValue.trim()) {
        updateEntry(id, field, '');
        return;
      }
      const entry = entries.find(e => e.id === id);
      const current = to12HourParts(entry ? entry[field] : '', field, id);
      const { hours, minutes } = parse12HourNumber(rawValue);
      delete pendingAmPm[`${id}_${field}`];
      updateEntry(id, field, to24Hour(hours, minutes, current.ampm));
    };

    window.toggleAmPm = (id, field) => {
      const entry = entries.find(e => e.id === id);
      const current = to12HourParts(entry ? entry[field] : '', field, id);
      const nextAmPm = current.ampm === 'AM' ? 'PM' : 'AM';
      if (!current.display) {
        // Nothing typed yet - just remember the flip for when a number is entered
        pendingAmPm[`${id}_${field}`] = nextAmPm;
        render();
        return;
      }
      const { hours, minutes } = parse12HourNumber(current.display);
      updateEntry(id, field, to24Hour(hours, minutes, nextAmPm));
    };

    function buildCalendarDays(year, month) {
      const firstOfMonth = new Date(year, month, 1);
      const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday-first grid
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const days = [];
      for (let i = 0; i < startOffset; i++) days.push(null);
      for (let d = 1; d <= daysInMonth; d++) days.push(d);
      return days;
    }

    function renderDatePicker(entryId) {
      if (!openDatePicker || openDatePicker.id !== entryId) return '';
      const { year, month, top, left } = openDatePicker;
      const monthName = new Date(year, month, 1).toLocaleDateString('en-NZ', { month: 'long', year: 'numeric' });
      const days = buildCalendarDays(year, month);
      const entry = entries.find(e => e.id === entryId);
      const selectedDate = entry ? entry.date : '';
      const todayStr = new Date().toISOString().split('T')[0];
      return `
        <div class="fixed inset-0 z-40" onclick="closeDatePicker()"></div>
        <div class="fixed z-50 bg-white border border-slate-300 rounded-lg shadow-lg p-3 w-64" style="top:${top}px; left:${left}px;" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between mb-2">
            <button type="button" onclick="navigateDatePickerMonth(-1)" class="p-1 rounded hover:bg-slate-100 text-slate-600">&#8592;</button>
            <span class="text-sm font-medium text-slate-700">${monthName}</span>
            <button type="button" onclick="navigateDatePickerMonth(1)" class="p-1 rounded hover:bg-slate-100 text-slate-600">&#8594;</button>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center text-xs text-slate-400 mb-1">
            ${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d => `<div>${d}</div>`).join('')}
          </div>
          <div class="grid grid-cols-7 gap-1">
            ${days.map(d => {
              if (d === null) return `<div></div>`;
              const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
              const isSelected = dateStr === selectedDate;
              const isToday = dateStr === todayStr;
              return `<button type="button" onclick="selectDate('${entryId}', '${dateStr}')" class="text-sm rounded py-1 ${isSelected ? 'bg-slate-800 text-white' : (isToday ? 'border border-slate-400 text-slate-700' : 'text-slate-700 hover:bg-slate-100')}">${d}</button>`;
            }).join('')}
          </div>
          <div class="flex justify-between mt-2 pt-2 border-t border-slate-200">
            <button type="button" onclick="selectDate('${entryId}', '')" class="text-xs text-slate-500 hover:text-slate-700">Clear</button>
            <button type="button" onclick="closeDatePicker()" class="text-xs text-slate-500 hover:text-slate-700">Close</button>
          </div>
        </div>
      `;
    }

    window.toggleDatePicker = (id, buttonEl) => {
      if (openDatePicker && openDatePicker.id === id) {
        openDatePicker = null;
      } else {
        const entry = entries.find(e => e.id === id);
        const base = entry && entry.date ? new Date(entry.date + 'T00:00:00') : new Date();
        const popoverWidth = 256; // w-64
        const popoverHeight = 300; // rough estimate
        const rect = buttonEl.getBoundingClientRect();
        let top = rect.bottom + 4;
        let left = rect.left;
        if (top + popoverHeight > window.innerHeight) {
          top = Math.max(8, rect.top - popoverHeight - 4);
        }
        if (left + popoverWidth > window.innerWidth) {
          left = Math.max(8, window.innerWidth - popoverWidth - 8);
        }
        openDatePicker = { id, year: base.getFullYear(), month: base.getMonth(), top, left };
      }
      render();
    };

    window.closeDatePicker = () => {
      openDatePicker = null;
      render();
    };

    window.navigateDatePickerMonth = (direction) => {
      if (!openDatePicker) return;
      let { year, month } = openDatePicker;
      month += direction;
      if (month < 0) { month = 11; year -= 1; }
      if (month > 11) { month = 0; year += 1; }
      openDatePicker = { ...openDatePicker, year, month };
      render();
    };

    window.selectDate = (id, dateStr) => {
      openDatePicker = null;
      updateEntry(id, 'date', dateStr);
      render();
    };

    function renderTimeCell(entry, field) {
      const { display, ampm } = to12HourParts(entry[field], field, entry.id);
      return `
        <div class="flex items-center gap-1">
          <input
            type="text"
            inputmode="decimal"
            placeholder="${field === 'endTime' ? '4.30' : '8.30'}"
            value="${display}"
            onchange="updateTimeNumber('${entry.id}', '${field}', this.value)"
            class="border border-slate-300 rounded px-2 py-1 text-sm w-14 focus:ring-2 focus:ring-slate-400 focus:border-transparent"
          />
          <button
            type="button"
            onclick="toggleAmPm('${entry.id}', '${field}')"
            class="border border-slate-300 rounded px-1.5 py-1 text-xs font-medium text-slate-600 hover:bg-slate-100 w-9"
          >${ampm}</button>
        </div>
      `;
    }

    function calculateTotals() {
      const byPerson = {};
      
      entries.forEach(entry => {
        if (!byPerson[entry.person]) {
          byPerson[entry.person] = { hours: 0, unpaidHours: 0, total: 0, unpaidTotal: 0, materials: 0, unpaidMaterials: 0 };
        }
        byPerson[entry.person].hours += entry.hours || 0;
        byPerson[entry.person].total += (entry.hours || 0) * rates[entry.person];
        
        if (!entry.paid) {
          byPerson[entry.person].unpaidHours += entry.hours || 0;
          byPerson[entry.person].unpaidTotal += (entry.hours || 0) * rates[entry.person];
        }
      });

      materials.forEach(material => {
        if (!byPerson[material.person]) {
          byPerson[material.person] = { hours: 0, unpaidHours: 0, total: 0, unpaidTotal: 0, materials: 0, unpaidMaterials: 0 };
        }
        const amount = parseFloat(material.amount || 0);
        byPerson[material.person].materials += amount;
        
        if (!material.paid) {
          byPerson[material.person].unpaidMaterials += amount;
          byPerson[material.person].unpaidTotal += amount;
        }
      });
      const grandTotal = Object.values(byPerson).reduce((sum, person) => sum + person.total, 0);
      const totalOwed = Object.values(byPerson).reduce((sum, person) => sum + person.unpaidTotal, 0);

      // Calculate after-tax: 25% tax only on labour, not materials
      let unpaidLabour = 0;
      let unpaidMaterials = 0;
      entries.forEach(entry => {
        if (!entry.paid) {
          unpaidLabour += (entry.hours || 0) * rates[entry.person];
        }
      });
      materials.forEach(material => {
        if (!material.paid) {
          unpaidMaterials += parseFloat(material.amount || 0);
        }
      });
      const afterTax = (unpaidLabour * 0.75) + unpaidMaterials;

      return { byPerson, grandTotal, totalOwed, afterTax };
    }

    function groupEntriesByMonth(entriesList) {
      const grouped = {};
      entriesList.forEach(entry => {
        if (entry.date) {
          const date = new Date(entry.date);
          const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          const monthName = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
          
          if (!grouped[monthKey]) {
            grouped[monthKey] = {
              name: monthName,
              entries: []
            };
          }
          grouped[monthKey].entries.push(entry);
        }
      });
      return grouped;
    }

    function groupMaterialsByMonth(materialsList) {
      const grouped = {};
      materialsList.forEach(material => {
        const date = new Date(material.createdAt);
        const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        const monthName = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
        
        if (!grouped[monthKey]) {
          grouped[monthKey] = {
            name: monthName,
            materials: []
          };
        }
        grouped[monthKey].materials.push(material);
      });
      return grouped;
    }

    // ---------- PDF invoice export ----------
    const BUSINESS_NAME = 'Zaine Te Reo Construction';
    const BUSINESS_ADDRESS = ['1108 Wainui Road,', 'Whakatāne, New Zealand 3198'];
    const BUSINESS_GST_NUMBER = '078-179-155';
    const GST_RATE = 0.15; // NZ GST
    const BANK_ACCOUNT_NAME = 'Zaine Te Reo';
    const BANK_ACCOUNT_NUMBER = '38-9018-0699797-00';
    // Known client addresses. Add more here as you take on new clients -
    // anyone missing just gets prompted for an address at export time.
    const clientAddresses = {
      'Shanti': '294 Stanley Road,\nWainui',
    };
    // Per-person "include GST on invoice" tick, set from the checkbox on each summary card.
    // Defaults to on (Zaine Te Reo Construction is GST-registered) until someone unticks it.
    let gstEnabled = {};

    window.toggleGst = (person, checked) => {
      gstEnabled[person] = checked;
    };

    // Custom export-invoice modal - replaces the old chain of window.prompt() calls, which
    // can't be styled (tiny native text boxes, square corners) and had no room for the GST
    // tick. Resolves to null on cancel, or {invoiceNumber, address, description, includeGst}.
    function openInvoiceModal({ person, defaultInvoiceNumber, defaultAddress, defaultGst }) {
      return new Promise((resolve) => {
        const modal = document.getElementById('invoiceModal');
        const personLabel = document.getElementById('invoiceModalPerson');
        const numberInput = document.getElementById('invoiceModalNumber');
        const addressInput = document.getElementById('invoiceModalAddress');
        const descInput = document.getElementById('invoiceModalDescription');
        const gstInput = document.getElementById('invoiceModalGst');
        const cancelBtn = document.getElementById('invoiceModalCancel');
        const confirmBtn = document.getElementById('invoiceModalConfirm');

        personLabel.textContent = ` for ${person}`;
        numberInput.value = defaultInvoiceNumber;
        addressInput.value = defaultAddress;
        descInput.value = '';
        gstInput.checked = defaultGst;

        modal.style.display = 'flex';
        numberInput.focus();
        numberInput.select();

        function cleanup() {
          modal.style.display = 'none';
          confirmBtn.removeEventListener('click', onConfirm);
          cancelBtn.removeEventListener('click', onCancel);
          modal.removeEventListener('mousedown', onBackdropClick);
          document.removeEventListener('keydown', onKeydown);
        }
        function onConfirm() {
          if (!numberInput.value.trim()) {
            numberInput.focus();
            return; // invoice number is required - leave the modal open
          }
          const result = {
            invoiceNumber: numberInput.value.trim(),
            address: addressInput.value,
            description: descInput.value,
            includeGst: gstInput.checked,
          };
          cleanup();
          resolve(result);
        }
        function onCancel() {
          cleanup();
          resolve(null);
        }
        function onBackdropClick(e) {
          if (e.target === modal) onCancel();
        }
        function onKeydown(e) {
          if (e.key === 'Escape') onCancel();
        }
        confirmBtn.addEventListener('click', onConfirm);
        cancelBtn.addEventListener('click', onCancel);
        modal.addEventListener('mousedown', onBackdropClick);
        document.addEventListener('keydown', onKeydown);
      });
    }

    // Loading the logo through a canvas (rather than handing jsPDF the raw fetched PNG bytes)
    // lets the browser's own image decoder do the work - jsPDF's built-in PNG decoder can choke
    // on some interlaced PNGs and silently skip the image, so this is the more reliable path.
    function loadImageAsDataURL(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    // jsPDF's built-in fonts (Helvetica/Times) only support WinAnsi encoding, which silently
    // drops characters outside it - including macrons, e.g. the ā in "Whakatāne" (it would
    // print as "Whakatne"). Rendering a line of text through canvas instead lets the browser's
    // own font/Unicode handling draw it correctly, then it goes into the PDF as an image.
    function textLinesToImage(lines, { fontSize = 10, bold = false, color = '#1e293b', align = 'left' } = {}) {
      const DPI = 200;
      const PT_TO_PX = DPI / 72;
      const MM_PER_PX = 25.4 / DPI;
      const fontPx = Math.round(fontSize * PT_TO_PX);
      const lineHeightPx = Math.round(fontSize * 1.4 * PT_TO_PX);
      const fontStr = `${bold ? 'bold ' : ''}${fontPx}px Helvetica, Arial, sans-serif`;
      const padding = Math.round(2 * PT_TO_PX);

      const measure = document.createElement('canvas').getContext('2d');
      measure.font = fontStr;
      let maxWidth = 1;
      lines.forEach(line => { maxWidth = Math.max(maxWidth, measure.measureText(line).width); });

      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(maxWidth) + padding * 2;
      canvas.height = lineHeightPx * lines.length + padding;
      const ctx = canvas.getContext('2d');
      ctx.font = fontStr;
      ctx.fillStyle = color;
      ctx.textBaseline = 'top';
      ctx.textAlign = align;
      const xPos = align === 'right' ? canvas.width - padding : padding;
      lines.forEach((line, i) => {
        ctx.fillText(line, xPos, i * lineHeightPx + padding / 2);
      });

      return {
        dataUrl: canvas.toDataURL('image/png'),
        widthMm: canvas.width * MM_PER_PX,
        heightMm: canvas.height * MM_PER_PX,
      };
    }

                              <div class="border-t border-slate-200">
                                <div class="overflow-x-auto">
                                  <table class="w-full">
                                    <thead class="bg-slate-50">
                                      <tr>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-slate-600 uppercase">Date</th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-slate-600 uppercase">Person</th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-slate-600 uppercase">Start</th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-slate-600 uppercase">End</th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-slate-600 uppercase">Hours</th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-slate-600 uppercase">Notes</th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-slate-600 uppercase">Amount</th>
                                        <th class="px-4 py-2 text-left text-xs font-medium text-slate-600 uppercase">Paid</th>
                                        <th class="px-4 py-2"></th>
                                      </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-200">
                                      ${monthData.entries.map(entry => `
                                        <tr class="bg-green-50">
                                          <td class="px-4 py-2 relative">
                                            <button
                                              type="button"
                                              onclick="toggleDatePicker('${entry.id}', this)"
                                              class="border border-slate-300 rounded px-2 py-1 text-sm w-full text-left focus:ring-2 focus:ring-slate-400 focus:border-transparent ${entry.date ? 'text-slate-800' : 'text-slate-400'}"
                                            >${formatDateDisplay(entry.date)}</button>
                                            ${renderDatePicker(entry.id)}
                                          </td>
                                          <td class="px-4 py-2">
                                            <select
                                              value="${entry.person}"
                                              onchange="updateEntry('${entry.id}', 'person', this.value)"
                                              class="border border-slate-300 rounded px-2 py-1 text-sm w-full focus:ring-2 focus:ring-slate-400 focus:border-transparent"
                                            >
                                              <option value="" ${!entry.person ? 'selected' : ''} disabled hidden>Select person</option>
                                              ${people.map(p => `<option ${entry.person === p ? 'selected' : ''}>${p}</option>`).join('')}
                                            </select>
                                          </td>
                                          <td class="px-4 py-2">
                                            ${renderTimeCell(entry, 'startTime')}
                                          </td>
                                          <td class="px-4 py-2">
                                            ${renderTimeCell(entry, 'endTime')}
                                          </td>
                                          <td class="px-4 py-2">
                                            <span class="font-medium text-slate-700">${(entry.hours || 0).toFixed(1)}</span>
                                          </td>
                                          <td class="px-4 py-2">
 <input
  type="text"
  placeholder="Project notes"
  value="${entry.notes || ''}"
  onchange="updateEntry('${entry.id}', 'notes', this.value)"
  class="border border-slate-300 rounded px-2 py-1 text-sm w-full min-w-64 focus:ring-2 focus:ring-slate-400 focus:border-transparent"
/>
                                          </td>
                                          <td class="px-4 py-2">
                                            <span class="font-medium text-slate-700">
                                              $${((entry.hours || 0) * rates[entry.person]).toFixed(2)}
                                            </span>
                                          </td>
                                          <td class="px-4 py-2">
                                            <button
                                              onclick="updateEntry('${entry.id}', 'paid', ${!entry.paid})"
                                              class="p-1 rounded ${entry.paid ? 'bg-green-500 text-white' : 'bg-slate-200 text-slate-400'}"
                                            >
                                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <polyline points="20 6 9 17 4 12"></polyline>
                                              </svg>
                                            </button>
                                          </td>
                                          <td class="px-4 py-2">
                                            <button
                                              onclick="deleteEntry('${entry.id}')"
                                              class="text-red-500 hover:text-red-700"
                                            >
                                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                              </svg>
                                            </button>
                                          </td>
                                        </tr>
                                      `).join('')}
                                    </tbody>
                                  </table>
                                </div>
                              </div>
                            ` : ''}
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                ` : ''}
              ` : activeTab === 'materials' ? `
                <div class="p-4 md:p-6 border-b border-slate-200 flex justify-between items-center">
                  <h2 class="text-lg md:text-xl font-semibold text-slate-800">Materials & Tools</h2>
                  <button
                    onclick="addMaterial()"
                    class="flex items-center gap-2 bg-slate-800 text-white px-3 md:px-4 py-2 rounded-lg hover:bg-slate-700 transition-colors text-sm md:text-base"
                  >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Material
                  </button>
                </div>
                
                <div class="p-4 md:p-6 space-y-3">
                  ${unpaidMaterials.map(material => `
                    <div class="flex items-center gap-4 p-4 border border-slate-200 rounded-lg">
                      <select
                        value="${material.person}"
                        onchange="updateMaterial('${material.id}', 'person', this.value)"
                        class="border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-slate-400 focus:border-transparent"
                      >
                        <option value="" ${!material.person ? 'selected' : ''} disabled hidden>Select person</option>
                        ${people.map(p => `<option ${material.person === p ? 'selected' : ''}>${p}</option>`).join('')}
                      </select>
                      <input
                        type="text"
                        placeholder="Materials, tools, etc."
                        value="${material.description || ''}"
                        onchange="updateMaterial('${material.id}', 'description', this.value)"
                        class="flex-1 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-slate-400 focus:border-transparent"
                      />
                      <div class="flex items-center gap-2">
                        <span class="text-slate-600">$</span>
                        <input
                          type="number"
                          step="0.01"
                          placeholder="0.00"
                          value="${material.amount || ''}"
                          onchange="updateMaterial('${material.id}', 'amount', this.value)"
                          class="w-28 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-slate-400 focus:border-transparent"
                        />
                      </div>
                      <button
                        onclick="updateMaterial('${material.id}', 'paid', ${!material.paid})"
                        class="p-2 rounded ${material.paid ? 'bg-green-500 text-white' : 'bg-slate-200 text-slate-400'}"
                      >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                      </button>
                      <button
                        onclick="deleteMaterial('${material.id}')"
                        class="text-red-500 hover:text-red-700"
                      >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <polyline points="3 6 5 6 21 6"></polyline>
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                      </button>
                    </div>
                  `).join('')}
                  ${unpaidMaterials.length === 0 ? `
                    <div class="text-center py-12 text-slate-400">
                      No unpaid materials. Click "Add Material" to track materials and tools.
                    </div>
                  ` : ''}
                </div>

                ${Object.keys(paidMaterialsByMonth).length > 0 ? `
                  <div class="border-t border-slate-200 bg-slate-50">
                    <div class="p-4 md:p-6">
                      <h3 class="text-lg font-semibold text-slate-700 mb-4">Past Paid Materials</h3>
                      <div class="space-y-2">
                        ${Object.entries(paidMaterialsByMonth).sort((a, b) => b[0].localeCompare(a[0])).map(([monthKey, monthData]) => `
                          <div class="border border-slate-200 rounded-lg bg-white overflow-hidden">
                            <button
                              onclick="toggleMonth('materials-${monthKey}')"
                              class="w-full px-4 py-3 flex items-center justify-between hover:bg-slate-50 transition-colors"
                            >
                              <span class="font-medium text-slate-700">${monthData.name}</span>
                              <div class="flex items-center gap-3">
                                <span class="text-sm text-slate-500">${monthData.materials.length} items</span>
                                <svg class="w-5 h-5 text-slate-400 transition-transform ${expandedMonths['materials-' + monthKey] ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                              </div>
                            </button>
                            ${expandedMonths['materials-' + monthKey] ? `
                              <div class="border-t border-slate-200 p-4 space-y-3">
                                ${monthData.materials.map(material => `
                                  <div class="flex items-center gap-4 p-4 border border-slate-200 rounded-lg bg-green-50">
                                    <select
                                      value="${material.person}"
                                      onchange="updateMaterial('${material.id}', 'person', this.value)"
                                      class="border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-slate-400 focus:border-transparent"
                                    >
                                      <option value="" ${!material.person ? 'selected' : ''} disabled hidden>Select person</option>
                                      ${people.map(p => `<option ${material.person === p ? 'selected' : ''}>${p}</option>`).join('')}
                                    </select>
                                    <input
                                      type="text"
                                      placeholder="Materials, tools, etc."
                                      value="${material.description || ''}"
                                      onchange="updateMaterial('${material.id}', 'description', this.value)"
                                      class="flex-1 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-slate-400 focus:border-transparent"
                                    />
                                    <div class="flex items-center gap-2">
                                      <span class="text-slate-600">$</span>
                                      <input
                                        type="number"
                                        step="0.01"
                                        placeholder="0.00"
                                        value="${material.amount || ''}"
                                        onchange="updateMaterial('${material.id}', 'amount', this.value)"
                                        class="w-28 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-slate-400 focus:border-transparent"
                                      />
                                    </div>
                                    <button
                                      onclick="updateMaterial('${material.id}', 'paid', ${!material.paid})"
                                      class="p-2 rounded ${material.paid ? 'bg-green-500 text-white' : 'bg-slate-200 text-slate-400'}"
                                    >
                                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                      </svg>
                                    </button>
                                    <button
                                      onclick="deleteMaterial('${material.id}')"
                                      class="text-red-500 hover:text-red-700"
                                    >
                                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                      </svg>
                                    </button>
                                  </div>
                                `).join('')}
                              </div>
                            ` : ''}
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                ` : ''}
              ` : `
                <div class="p-4 md:p-6 border-b border-slate-200 flex justify-between items-center">
                  <h2 class="text-lg md:text-xl font-semibold text-slate-800">People & Rates</h2>
                  <button
                    onclick="addPerson()"
                    class="flex items-center gap-2 bg-slate-800 text-white px-3 md:px-4 py-2 rounded-lg hover:bg-slate-700 transition-colors text-sm md:text-base"
                  >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Person
                  </button>
                </div>

                <div class="p-4 md:p-6 space-y-3">
                  ${people.length === 0 ? `
                    <p class="text-slate-500 text-sm">No people yet. Click "Add Person" to get started.</p>
                  ` : people.map(person => `
                    <div class="flex items-center justify-between gap-4 p-4 border border-slate-200 rounded-lg">
                      <span class="font-medium text-slate-700">${person}</span>
                      <div class="flex items-center gap-2">
                        <span class="text-slate-500 text-sm">$</span>
                        <input
                          type="number"
                          step="0.01"
                          min="0"
                          value="${rates[person] !== undefined ? rates[person] : ''}"
                          onchange="updatePersonRate('${person}', this.value)"
                          class="w-24 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-slate-400 focus:border-transparent"
                        />
                        <span class="text-slate-500 text-sm">/hr</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>

          <div class="mt-8 bg-gradient-to-r from-slate-800 to-slate-700 rounded-xl shadow-lg p-6 md:p-8 text-white">
  <div class="flex flex-col md:flex-row justify-between md:items-center gap-4">
    <div>
      <p class="text-slate-300 text-xs md:text-sm uppercase tracking-wide mb-1">Total Amount Owed (Gross)</p>
      <p class="text-3xl md:text-5xl font-bold">$${totals.totalOwed.toFixed(2)}</p>
      <p class="text-slate-300 text-xs md:text-sm mt-2">After Tax (Net - 25%)</p>
<p class="text-2xl md:text-3xl font-semibold">$${totals.afterTax.toFixed(2)}</p>
    </div>
    <div class="md:text-right">
      <p class="text-slate-300 text-xs md:text-sm mb-2">Grand Total (After Tax)</p>
      <p class="text-xl md:text-2xl font-semibold">$${(totals.grandTotal * 0.75).toFixed(2)}</p>
    </div>
  </div>
</div>
          </div>
        </div>
      `;
      requestAnimationFrame(() => window.scrollTo(0, scrollPos));
    }

   // Initial render
    setTimeout(render, 1000);
  }
  
  window.initApp = initApp;
</script>
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center p-6">
    <div class="bg-white rounded-xl shadow-lg border border-slate-200 p-8 max-w-md w-full">
      <h1 class="text-3xl font-bold text-slate-800 mb-2 text-center">Timesheet Tracker</h1>
      <p class="text-slate-600 text-center mb-6">Enter password to continue</p>
      <input 
  type="text" 
  name="username"
  autocomplete="username"
  style="display:none;"
/>
      <input 
        type="password" 
        id="passwordInput"
        autocomplete="current-password"
        placeholder="Enter password"
        onkeypress="if(event.key==='Enter') checkPassword()"
        class="w-full border border-slate-300 rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-slate-400 focus:border-transparent mb-4"
      />
      
      <button 
        onclick="checkPassword()"
        class="w-full bg-slate-800 text-white px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors font-medium"
      >
        Login
      </button>
      
      <p id="errorMessage" style="display:none;" class="text-red-500 text-sm mt-3 text-center font-semibold">
        Incorrect password. Please try again.
      </p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" style="display:none;">
    <div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 flex items-center justify-center">
      <div class="text-slate-600 text-lg">Loading timesheet...</div>
    </div>
  </div>

  <!-- Export Invoice modal. Lives outside #app (which render() fully replaces on every
       Firestore update) so it isn't wiped out or reset mid-edit if data changes elsewhere. -->
  <div id="invoiceModal" style="display:none;" class="fixed inset-0 bg-slate-900/60 items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg p-7 space-y-5 max-h-[90vh] overflow-y-auto">
      <h2 class="text-xl font-semibold text-slate-800">Export invoice<span id="invoiceModalPerson"></span></h2>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Invoice number</label>
        <input
          id="invoiceModalNumber"
          type="text"
          class="w-full border border-slate-300 rounded-xl px-4 py-3 text-base focus:ring-2 focus:ring-slate-400 focus:border-transparent"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Bill-to address (one or more lines)</label>
        <textarea
          id="invoiceModalAddress"
          rows="4"
          class="w-full border border-slate-300 rounded-xl px-4 py-3 text-base focus:ring-2 focus:ring-slate-400 focus:border-transparent resize-y"
        ></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Description of works (optional)</label>
        <textarea
          id="invoiceModalDescription"
          rows="4"
          placeholder="Leave blank to omit"
          class="w-full border border-slate-300 rounded-xl px-4 py-3 text-base focus:ring-2 focus:ring-slate-400 focus:border-transparent resize-y"
        ></textarea>
      </div>

      <label class="flex items-center gap-3 cursor-pointer select-none bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
        <input id="invoiceModalGst" type="checkbox" class="w-5 h-5 accent-slate-800 cursor-pointer" />
        <span class="text-sm font-medium text-slate-700">Include GST (15%) on this invoice</span>
      </label>

      <div class="flex justify-end gap-3 pt-1">
        <button id="invoiceModalCancel" type="button" class="px-4 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-medium transition-colors">
          Cancel
        </button>
        <button id="invoiceModalConfirm" type="button" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-medium transition-colors">
          Export PDF
        </button>
      </div>
    </div>
  </div>
</body>
</html>
